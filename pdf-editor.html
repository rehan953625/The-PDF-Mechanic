<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Mechanic - Professional PDF Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --background: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-light: #475569;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --radius: 8px;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }

        .logo svg {
            width: 32px;
            height: 32px;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-light);
            font-size: 14px;
        }

        .file-info span {
            background: var(--background);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        /* Toolbar */
        .toolbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            box-shadow: var(--shadow-sm);
            z-index: 90;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 8px;
            border-right: 1px solid var(--border);
        }

        .tool-group:last-child {
            border-right: none;
        }

        .tool-btn {
            padding: 8px 12px;
            background: transparent;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn:hover {
            background: var(--background);
            color: var(--primary);
        }

        .tool-btn.active {
            background: var(--primary);
            color: white;
        }

        .tool-btn svg {
            width: 16px;
            height: 16px;
        }

        .tool-separator {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 8px;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .pdf-container {
            flex: 1;
            overflow: auto;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #e2e8f0;
            position: relative;
        }

        .pdf-pages {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .pdf-page {
            background: white;
            box-shadow: var(--shadow-lg);
            position: relative;
            transform-origin: top center;
            transition: transform 0.3s ease;
        }

        .pdf-page canvas {
            display: block;
        }

        .text-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .editable-text {
            position: absolute;
            pointer-events: auto;
            cursor: text;
            min-width: 50px;
            min-height: 20px;
            border: 1px solid transparent;
            padding: 2px;
            border-radius: 3px;
            font-size: 14px;
            line-height: 1.4;
            transition: all 0.2s;
            background: transparent;
        }

        .editable-text:hover {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }

        .editable-text:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        .editable-text.selected {
            border: 2px solid var(--primary);
            background: rgba(37, 99, 235, 0.1);
        }

        .image-overlay {
            position: absolute;
            pointer-events: auto;
            cursor: move;
        }

        .image-overlay img {
            display: block;
            max-width: 100%;
            height: auto;
            border: 2px solid transparent;
            border-radius: 4px;
        }

        .image-overlay:hover {
            border-color: var(--primary);
        }

        .image-overlay.selected {
            border: 2px solid var(--primary);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .sidebar.hidden {
            width: 0;
            transform: translateX(100%);
        }

        .sidebar-content {
            padding: 20px;
        }

        .sidebar-section {
            margin-bottom: 24px;
        }

        .sidebar-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .property-group {
            margin-bottom: 16px;
        }

        .property-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .property-group input[type="text"],
        .property-group input[type="number"],
        .property-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .property-group input:focus,
        .property-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .property-group input[type="color"] {
            height: 40px;
            padding: 4px;
            cursor: pointer;
        }

        .property-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* Zoom Controls */
        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 300px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 80;
            transition: right 0.3s ease;
        }

        .zoom-controls.sidebar-hidden {
            right: 20px;
        }

        .zoom-btn {
            padding: 6px 10px;
            background: transparent;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-light);
            font-size: 16px;
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background: var(--background);
        }

        .zoom-value {
            padding: 0 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-light);
            min-width: 40px;
            text-align: center;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 90%;
            max-width: 500px;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1100;
            animation: slideIn 0.3s ease;
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
                position: fixed;
                right: 0;
                top: 0;
                bottom: 0;
                z-index: 95;
            }

            .zoom-controls {
                right: 260px;
            }

            .toolbar {
                padding: 8px;
            }

            .tool-btn {
                padding: 6px 8px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    PDF Mechanic
                </div>
                <div class="file-info">
                    <span id="fileName">No file loaded</span>
                    <span id="pageInfo"></span>
                </div>
            </div>
            <div class="header-actions">
                <button class="tool-btn" onclick="openFile()" title="Open PDF">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                    Open
                </button>
                <button class="tool-btn" onclick="savePDF()" title="Save PDF">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Save
                </button>
                <button class="tool-btn" onclick="downloadPDF()" title="Download PDF">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download
                </button>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" onclick="setTool('select')" id="selectTool">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    Select
                </button>
                <button class="tool-btn" onclick="setTool('text')" id="textTool">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 7 4 4 20 4 20 7"/>
                        <line x1="9" y1="20" x2="15" y2="20"/>
                        <line x1="12" y1="4" x2="12" y2="20"/>
                    </svg>
                    Add Text
                </button>
                <button class="tool-btn" onclick="setTool('image')" id="imageTool">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    Add Image
                </button>
                <button class="tool-btn" onclick="setTool('sign')" id="signTool">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L15 7H18L15 11L18 16H15L12 21L9 16H6L9 11L6 7H9L12 2Z"/>
                    </svg>
                    E-Sign
                </button>
            </div>
            
            <div class="tool-separator"></div>
            
            <div class="tool-group">
                <button class="tool-btn" onclick="deleteSelected()" title="Delete Selected">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    Delete
                </button>
                <button class="tool-btn" onclick="duplicateSelected()" title="Duplicate">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    Duplicate
                </button>
            </div>
            
            <div class="tool-separator"></div>
            
            <div class="tool-group">
                <button class="tool-btn" onclick="undoAction()" title="Undo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                </button>
                <button class="tool-btn" onclick="redoAction()" title="Redo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"/>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                    </svg>
                </button>
            </div>
            
            <div class="tool-separator"></div>
            
            <div class="tool-group">
                <button class="tool-btn" onclick="toggleSidebar()" title="Properties">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="21" x2="4" y2="14"/>
                        <line x1="4" y1="10" x2="4" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12" y2="3"/>
                        <line x1="20" y1="21" x2="20" y2="16"/>
                        <line x1="20" y1="12" x2="20" y2="3"/>
                        <line x1="1" y1="14" x2="7" y2="14"/>
                        <line x1="9" y1="8" x2="15" y2="8"/>
                        <line x1="17" y1="16" x2="23" y2="16"/>
                    </svg>
                    Properties
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="pdf-container" id="pdfContainer">
                <div class="pdf-pages" id="pdfPages">
                    <!-- PDF pages will be rendered here -->
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-content">
                <div class="sidebar-section">
                    <h3>Properties</h3>
                    <div class="property-group">
                        <label>Font Size</label>
                        <input type="number" id="fontSize" value="14" min="8" max="72" onchange="updateSelectedProperty('fontSize', this.value)">
                    </div>
                    <div class="property-group">
                        <label>Font Family</label>
                        <select id="fontFamily" onchange="updateSelectedProperty('fontFamily', this.value)">
                            <option value="Arial">Arial</option>
                            <option value="Helvetica">Helvetica</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Verdana">Verdana</option>
                        </select>
                    </div>
                    <div class="property-group">
                        <label>Text Color</label>
                        <input type="color" id="textColor" value="#000000" onchange="updateSelectedProperty('color', this.value)">
                    </div>
                    <div class="property-group">
                        <label>Background Color</label>
                        <input type="color" id="bgColor" value="#ffffff" onchange="updateSelectedProperty('backgroundColor', this.value)">
                    </div>
                    <div class="property-group">
                        <label>Opacity</label>
                        <input type="range" id="opacity" min="0" max="100" value="100" onchange="updateSelectedProperty('opacity', this.value / 100)">
                    </div>
                </div>
            </div>
        </div>

        <!-- Zoom Controls -->
        <div class="zoom-controls" id="zoomControls">
            <button class="zoom-btn" onclick="zoomOut()">−</button>
            <span class="zoom-value" id="zoomValue">100%</span>
            <button class="zoom-btn" onclick="zoomIn()">+</button>
            <button class="zoom-btn" onclick="fitToWidth()">Fit Width</button>
            <button class="zoom-btn" onclick="resetZoom()">Reset</button>
        </div>
    </div>

    <!-- File Input -->
    <input type="file" id="fileInput" accept=".pdf" style="display: none" onchange="loadPDF(this)">
    <input type="file" id="imageInput" accept="image/*" style="display: none" onchange="addImage(this)">

    <script>
        // PDF.js configuration
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Global state
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let zoomLevel = 1;
        let currentTool = 'select';
        let selectedElement = null;
        let undoStack = [];
        let redoStack = [];
        let pagesData = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Set up event listeners
            document.addEventListener('click', handleGlobalClick);
            document.addEventListener('keydown', handleKeyboardShortcuts);
        });

        // Open file dialog
        function openFile() {
            document.getElementById('fileInput').click();
        }

        // Load PDF file
        async function loadPDF(input) {
            const file = input.files[0];
            if (!file) return;

            try {
                const arrayBuffer = await file.arrayBuffer();
                pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                totalPages = pdfDoc.numPages;
                document.getElementById('fileName').textContent = file.name;
                
                // Initialize pages data
                pagesData = [];
                for (let i = 0; i < totalPages; i++) {
                    pagesData.push({
                        elements: [],
                        pageNumber: i + 1
                    });
                }
                
                await renderAllPages();
                showToast('PDF loaded successfully');
            } catch (error) {
                console.error('Error loading PDF:', error);
                showToast('Error loading PDF', 'error');
            }
            
            input.value = '';
        }

        // Render all pages
        async function renderAllPages() {
            const container = document.getElementById('pdfPages');
            container.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: zoomLevel });
                
                const pageDiv = document.createElement('div');
                pageDiv.className = 'pdf-page';
                pageDiv.style.width = viewport.width + 'px';
                pageDiv.style.height = viewport.height + 'px';
                pageDiv.dataset.pageNumber = i;
                
                // Canvas for PDF content
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                pageDiv.appendChild(canvas);
                
                const context = canvas.getContext('2d');
                await page.render({ canvasContext: context, viewport: viewport }).promise;
                
                // Text overlay for editable content
                const overlay = document.createElement('div');
                overlay.className = 'text-overlay';
                pageDiv.appendChild(overlay);
                
                container.appendChild(pageDiv);
            }
            
            updatePageInfo();
        }

        // Set active tool
        function setTool(tool) {
            currentTool = tool;
            
            // Update button states
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tool + 'Tool').classList.add('active');
            
            // Clear selection
            if (selectedElement) {
                selectedElement.classList.remove('selected');
                selectedElement = null;
            }
        }

        // Handle global click
        function handleGlobalClick(e) {
            const target = e.target;
            
            // Handle text/image selection
            if (target.classList.contains('editable-text') || target.classList.contains('image-overlay')) {
                selectElement(target);
            } else if (!target.closest('.sidebar') && !target.closest('.toolbar')) {
                // Deselect
                if (selectedElement) {
                    selectedElement.classList.remove('selected');
                    selectedElement = null;
                }
            }
            
            // Handle tool actions
            if (currentTool === 'text' && target.classList.contains('pdf-page')) {
                addTextToPage(target, e);
            } else if (currentTool === 'image' && target.classList.contains('pdf-page')) {
                document.getElementById('imageInput').click();
            }
        }

        // Select element
        function selectElement(element) {
            if (selectedElement) {
                selectedElement.classList.remove('selected');
            }
            selectedElement = element;
            element.classList.add('selected');
            
            // Update properties panel
            updatePropertiesPanel(element);
        }

        // Add text to page
        function addTextToPage(pageDiv, event) {
            const overlay = pageDiv.querySelector('.text-overlay');
            const rect = pageDiv.getBoundingClientRect();
            
            const textElement = document.createElement('div');
            textElement.className = 'editable-text';
            textElement.contentEditable = true;
            textElement.textContent = 'Enter text';
            textElement.style.left = (event.clientX - rect.left) + 'px';
            textElement.style.top = (event.clientY - rect.top) + 'px';
            textElement.style.fontSize = document.getElementById('fontSize').value + 'px';
            textElement.style.fontFamily = document.getElementById('fontFamily').value;
            textElement.style.color = document.getElementById('textColor').value;
            
            overlay.appendChild(textElement);
            
            const pageNumber = parseInt(pageDiv.dataset.pageNumber);
            pagesData[pageNumber - 1].elements.push(textElement);
            
            saveState();
            selectElement(textElement);
            
            // Focus on the new text
            setTimeout(() => textElement.focus(), 100);
        }

        // Add image to page
        function addImage(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const imgData = e.target.result;
                
                // Find current page
                const pages = document.querySelectorAll('.pdf-page');
                const currentPageDiv = pages[currentPage - 1];
                const overlay = currentPageDiv.querySelector('.text-overlay');
                
                const imageContainer = document.createElement('div');
                imageContainer.className = 'image-overlay';
                imageContainer.style.left = '100px';
                imageContainer.style.top = '100px';
                imageContainer.style.width = '200px';
                imageContainer.style.height = 'auto';
                
                const img = document.createElement('img');
                img.src = imgData;
                img.style.width = '100%';
                img.style.height = 'auto';
                
                imageContainer.appendChild(img);
                overlay.appendChild(imageContainer);
                
                const pageNumber = parseInt(currentPageDiv.dataset.pageNumber);
                pagesData[pageNumber - 1].elements.push(imageContainer);
                
                saveState();
                selectElement(imageContainer);
                
                // Make image draggable
                makeDraggable(imageContainer);
            };
            
            reader.readAsDataURL(file);
            input.value = '';
        }

        // Make element draggable
        function makeDraggable(element) {
            let isDragging = false;
            let startX, startY, originalX, originalY;
            
            element.addEventListener('mousedown', (e) => {
                if (currentTool !== 'select') return;
                
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                originalX = parseInt(element.style.left);
                originalY = parseInt(element.style.top);
                
                element.style.cursor = 'grabbing';
                e.preventDefault();
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                
                element.style.left = (originalX + dx) + 'px';
                element.style.top = (originalY + dy) + 'px';
            });
            
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    element.style.cursor = 'move';
                    saveState();
                }
            });
        }

        // Delete selected element
        function deleteSelected() {
            if (!selectedElement) return;
            
            const pageNumber = parseInt(selectedElement.closest('.pdf-page').dataset.pageNumber);
            const elements = pagesData[pageNumber - 1].elements;
            const index = elements.indexOf(selectedElement);
            
            if (index > -1) {
                elements.splice(index, 1);
                selectedElement.remove();
                selectedElement = null;
                saveState();
                showToast('Element deleted');
            }
        }

        // Duplicate selected element
        function duplicateSelected() {
            if (!selectedElement) return;
            
            const clone = selectedElement.cloneNode(true);
            
            // Offset position slightly
            const left = parseInt(selectedElement.style.left) + 20;
            const top = parseInt(selectedElement.style.top) + 20;
            clone.style.left = left + 'px';
            clone.style.top = top + 'px';
            
            selectedElement.parentNode.appendChild(clone);
            
            const pageNumber = parseInt(selectedElement.closest('.pdf-page').dataset.pageNumber);
            pagesData[pageNumber - 1].elements.push(clone);
            
            selectElement(clone);
            saveState();
        }

        // Update properties panel
        function updatePropertiesPanel(element) {
            if (element.classList.contains('editable-text')) {
                document.getElementById('fontSize').value = parseInt(element.style.fontSize);
                document.getElementById('fontFamily').value = element.style.fontFamily;
                document.getElementById('textColor').value = element.style.color;
            }
        }

        // Update selected element property
        function updateSelectedProperty(property, value) {
            if (!selectedElement) return;
            
            switch(property) {
                case 'fontSize':
                    selectedElement.style.fontSize = value + 'px';
                    break;
                case 'fontFamily':
                    selectedElement.style.fontFamily = value;
                    break;
                case 'color':
                    selectedElement.style.color = value;
                    break;
                case 'backgroundColor':
                    selectedElement.style.backgroundColor = value;
                    break;
                case 'opacity':
                    selectedElement.style.opacity = value;
                    break;
            }
            
            saveState();
        }

        // Zoom functions
        function zoomIn() {
            if (zoomLevel < 2) {
                zoomLevel += 0.1;
                applyZoom();
            }
        }

        function zoomOut() {
            if (zoomLevel > 0.3) {
                zoomLevel -= 0.1;
                applyZoom();
            }
        }

        function resetZoom() {
            zoomLevel = 1;
            applyZoom();
        }

        function fitToWidth() {
            const container = document.getElementById('pdfContainer');
            const containerWidth = container.clientWidth - 40;
            const firstPage = document.querySelector('.pdf-page');
            
            if (firstPage) {
                const pageWidth = firstPage.offsetWidth / zoomLevel;
                zoomLevel = (containerWidth / pageWidth) * 0.9;
                applyZoom();
            }
        }

        function applyZoom() {
            const pages = document.querySelectorAll('.pdf-page');
            pages.forEach((page, index) => {
                page.style.transform = `scale(${zoomLevel})`;
            });
            
            document.getElementById('zoomValue').textContent = Math.round(zoomLevel * 100) + '%';
        }

        // Update page info
        function updatePageInfo() {
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
        }

        // Toggle sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const zoomControls = document.getElementById('zoomControls');
            
            sidebar.classList.toggle('hidden');
            zoomControls.classList.toggle('sidebar-hidden');
        }

        // Save PDF
        function savePDF() {
            // Save state to localStorage
            const state = {
                pagesData: pagesData.map(page => ({
                    elements: page.elements.map(el => ({
                        type: el.className,
                        left: el.style.left,
                        top: el.style.top,
                        fontSize: el.style.fontSize,
                        fontFamily: el.style.fontFamily,
                        color: el.style.color,
                        text: el.textContent,
                        src: el.querySelector('img') ? el.querySelector('img').src : null,
                        width: el.style.width
                    }))
                }))
            };
            
            localStorage.setItem('pdfState', JSON.stringify(state));
            showToast('Project saved successfully');
        }

        // Download PDF
        async function downloadPDF() {
            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF();
                
                for (let i = 1; i <= totalPages; i++) {
                    if (i > 1) pdf.addPage();
                    
                    const pageElement = document.querySelector(`.pdf-page[data-page-number="${i}"]`);
                    if (pageElement) {
                        const canvas = await html2canvas(pageElement, {
                            scale: 2,
                            useCORS: true,
                            logging: false
                        });
                        
                        const imgData = canvas.toDataURL('image/png');
                        const pageWidth = pdf.internal.pageSize.getWidth();
                        const pageHeight = pdf.internal.pageSize.getHeight();
                        
                        pdf.addImage(imgData, 'PNG', 0, 0, pageWidth, pageHeight);
                    }
                }
                
                pdf.save('edited-document.pdf');
                showToast('PDF downloaded successfully');
            } catch (error) {
                console.error('Error downloading PDF:', error);
                showToast('Error downloading PDF', 'error');
            }
        }

        // Undo/Redo
        function saveState() {
            const state = document.getElementById('pdfPages').innerHTML;
            undoStack.push(state);
            redoStack = [];
            
            // Limit undo stack
            if (undoStack.length > 50) {
                undoStack.shift();
            }
        }

        function undoAction() {
            if (undoStack.length > 1) {
                const currentState = undoStack.pop();
                redoStack.push(currentState);
                const previousState = undoStack[undoStack.length - 1];
                document.getElementById('pdfPages').innerHTML = previousState;
            }
        }

        function redoAction() {
            if (redoStack.length > 0) {
                const state = redoStack.pop();
                undoStack.push(state);
                document.getElementById('pdfPages').innerHTML = state;
            }
        }

        // Keyboard shortcuts
        function handleKeyboardShortcuts(e) {
            // Ctrl/Cmd + Z for undo
            if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undoAction();
            }
            
            // Ctrl/Cmd + Shift + Z or Ctrl/Cmd + Y for redo
            if ((e.ctrlKey || e.metaKey) && ((e.key === 'z' && e.shiftKey) || e.key === 'y')) {
                e.preventDefault();
                redoAction();
            }
            
            // Delete key for removing selected element
            if (e.key === 'Delete' && selectedElement) {
                e.preventDefault();
                deleteSelected();
            }
            
            // Escape to deselect
            if (e.key === 'Escape' && selectedElement) {
                selectedElement.classList.remove('selected');
                selectedElement = null;
            }
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast' + (type === 'error' ? ' error' : '');
            toast.textContent = message;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Add E-Sign functionality
        function createSignaturePad() {
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Create Signature</h2>
                        <button class="close-btn" onclick="closeSignatureModal(this)">&times;</button>
                    </div>
                    <canvas id="signatureCanvas" width="500" height="200" style="border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 16px;"></canvas>
                    <div style="display: flex; gap: 8px; justify-content: flex-end;">
                        <button class="tool-btn" onclick="clearSignature()">Clear</button>
                        <button class="tool-btn" style="background: var(--primary); color: white;" onclick="applySignature()">Apply Signature</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            initializeSignaturePad();
        }

        function initializeSignaturePad() {
            const canvas = document.getElementById('signatureCanvas');
            const ctx = canvas.getContext('2d');
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            
            canvas.addEventListener('mousedown', (e) => {
                isDrawing = true;
                [lastX, lastY] = [e.offsetX, e.offsetY];
            });
            
            canvas.addEventListener('mousemove', (e) => {
                if (!isDrawing) return;
                
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.stroke();
                
                [lastX, lastY] = [e.offsetX, e.offsetY];
            });
            
            canvas.addEventListener('mouseup', () => {
                isDrawing = false;
            });
            
            canvas.addEventListener('mouseleave', () => {
                isDrawing = false;
            });
        }

        function clearSignature() {
            const canvas = document.getElementById('signatureCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function applySignature() {
            const canvas = document.getElementById('signatureCanvas');
            const signatureData = canvas.toDataURL();
            
            // Add signature to current page
            const pages = document.querySelectorAll('.pdf-page');
            const currentPageDiv = pages[currentPage - 1];
            const overlay = currentPageDiv.querySelector('.text-overlay');
            
            const imageContainer = document.createElement('div');
            imageContainer.className = 'image-overlay';
            imageContainer.style.left = '100px';
            imageContainer.style.top = '100px';
            imageContainer.style.width = '200px';
            
            const img = document.createElement('img');
            img.src = signatureData;
            img.style.width = '100%';
            
            imageContainer.appendChild(img);
            overlay.appendChild(imageContainer);
            
            const pageNumber = parseInt(currentPageDiv.dataset.pageNumber);
            pagesData[pageNumber - 1].elements.push(imageContainer);
            
            saveState();
            closeSignatureModal(document.querySelector('.close-btn'));
            showToast('Signature added successfully');
        }

        function closeSignatureModal(btn) {
            btn.closest('.modal').remove();
        }

        // Update sign tool to open signature pad
        const originalSetTool = setTool;
        setTool = function(tool) {
            if (tool === 'sign') {
                createSignaturePad();
                return;
            }
            originalSetTool(tool);
        };
    </script>
</body>
